services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tirofederal-app
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      # Montar el código fuente para desarrollo en vivo (hot-reload)
      - .:/app
      # Preservar vendor y node_modules dentro del contenedor (no pisar con el host)
      - vendor_data:/app/vendor
      - node_modules_data:/app/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/database/database.sqlite
    # Todo se ejecuta en orden; solo `php artisan serve` queda en segundo plano.
    # (Antes el `&` mandaba toda la cadena al fondo y `pnpm dev` arrancaba
    # antes de que terminara `composer install`, rompiendo wayfinder.)
    command:
      - bash
      - -c
      - |
        set -e
        git config --global --add safe.directory /app
        composer install --no-interaction
        pnpm install
        [ -f .env ] || cp .env.example .env
        grep -q '^APP_KEY=base64:' .env || php artisan key:generate --no-interaction
        touch database/database.sqlite
        php artisan migrate --force --no-interaction
        php artisan serve --host=0.0.0.0 --port=8000 &
        exec pnpm dev --host 0.0.0.0

volumes:
  vendor_data:
  node_modules_data:
